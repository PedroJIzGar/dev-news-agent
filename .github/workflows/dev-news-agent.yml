name: Dev News Agent

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Run agent
        run: pnpm start
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_TELEGRAM_NOTIFICATIONS: ${{ secrets.ENABLE_TELEGRAM_NOTIFICATIONS }}

      - name: Commit generated archive
        run: |
          git config user.name "dev-news-agent"
          git config user.email "dev-news-agent@users.noreply.github.com"
          git add archives data
          git commit -m "chore: add daily dev news archive" || echo "No changes to commit"
          git push
